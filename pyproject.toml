[project]
name = "msnow-bootstrap"
version = "0.1.0"
description = "Apply development standards to a repo."
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["copier>=9.19,<9.20", "packaging>=23", "pyyaml>=6,<7"]

[project.scripts]
bootstrap = "bootstrap.cli:main"

[dependency-groups]
dev = ["mypy>=2.4,<3", "pytest>=9.2,<10", "ruff>=0.17,<0.18", "types-pyyaml>=6,<7"]

[build-system]
requires = ["uv_build>=0.9.30,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bootstrap"

[tool.uv]
required-version = ">=0.9.30"
