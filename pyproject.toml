[project]
name = "msnow-bootstrap"
version = "0.1.0"
description = "Apply development standards to a repo."
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["copier>=9.19,<10"]

[project.scripts]
bootstrap = "bootstrap.cli:main"

[dependency-groups]
dev = ["mypy>=2.4,<3", "pytest>=9.2,<10", "ruff>=0.17,<0.18"]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bootstrap"
