_subdirectory: template
_exclude:
  - "copier.yaml"
  - "copier.yml"
  - "~*"
  - "*.py[co]"
  - "__pycache__"
  - ".git"
  - ".DS_Store"
  - ".svn"
  - "AGENTS.md"
  - "CLAUDE.md"

languages:
  type: yaml
  multiselect: true
  choices:
    - python
    - go
    - rust
  default: []
  help: Languages of the target repo. The command detects them and never asks.
