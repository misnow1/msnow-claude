_subdirectory: template
_exclude:
  - "copier.yaml"
  - "copier.yml"
  - "~*"
  - "*.py[co]"
  - "__pycache__"
  - ".git"
  - ".DS_Store"
  - ".svn"
  - "AGENTS.md"
  - "CLAUDE.md"
# Copier writes these files once, and the project owns them. If a later version of the template
# drops one of them, an update deletes the edited copy in each project.
_skip_if_exists:
  - "docs/severity-policy.md"

languages:
  type: yaml
  multiselect: true
  choices:
    - python
    - go
    - rust
  default: []
  help: Languages of the target repo. The command detects them and never asks.
