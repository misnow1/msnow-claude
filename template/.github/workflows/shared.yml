name: Shared checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  file-length:
    name: file-length
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.9.30"
          enable-cache: false
      - run: make length
  # docs (#14): add your jobs below this line
  # pull request checks (#13): add zizmor and gitleaks below this line
